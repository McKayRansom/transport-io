[package]
name = "transport-io"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "2.7.0"
directories = "5.0.1"
macroquad = "0.4.14"
macroquad-profiler = "0.2.0"
noise = "0.9.0"
pathfinding = "4.11.0"
quad-storage = "0.1.3"
ron = "0.8.1"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
toml = "0.8.19"
log = "0.4.27"

[target.wasm32-unknown-unknown.dependencies]
sapp-console-log = "0.1"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8" # any other log-rs frontend will work fine as well


[[bin]]
name = "transport-io"
path = "src/main.rs"

[dev-dependencies]
test-log = "0.2.17"

